name: Docker Build and Publish

# Só em merge/push na branch main.
# Versão das tags da imagem: variável de repositório TAG_VERSION (Settings → Secrets and variables → Actions → Variables).
# O GitHub só aceita letras, números e _ no nome da variável — use TAG_VERSION (não "tag-version").
# Valor esperado: MAJOR.MINOR.PATCH (ex.: 2.0.3). Publica :2.0.3, :2.0, :2 e :latest.
on:
  push:
    branches:
      - main
    # Mudanças somente nestes caminhos não acionam o build (docs / ignore / CI)
    paths-ignore:
      - '.github/workflows/docker-build.yml'
      - '.github/workflows/lint.yml'
      - '.gitignore'
      - '.dockerignore'
      - 'README.md'

env:
  IMAGE_NAME: troubleshoot

jobs:
  docker:
    runs-on: ubuntu-latest
    #runs-on: self-hosted

    permissions:
      contents: read

    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      TAG_VERSION: ${{ vars.TAG_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="${DH_USER}/${IMAGE_NAME}"

          VERSION="$(echo -n "${TAG_VERSION}" | tr -d '[:space:]')"
          VERSION="${VERSION#[vV]}"
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Defina a variável de repositório TAG_VERSION (ex.: 2.0.3) em Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::TAG_VERSION inválida '${TAG_VERSION}'. Use MAJOR.MINOR.PATCH (ex.: 2.0.3)."
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
          FULL="${MAJOR}.${MINOR}.${PATCH}"

          echo "Verificando se a tag patch :${FULL} ainda não existe no registry..."
          set +e
          INSPECT_OUT="$(docker manifest inspect "${IMAGE}:${FULL}" 2>&1)"
          INSPECT_RC=$?
          set -e
          if [[ "${INSPECT_RC}" -eq 0 ]]; then
            echo "::error::A tag '${FULL}' já existe em ${IMAGE}. Incremente o PATCH em TAG_VERSION (ex.: nova versão de patch) para publicar de novo; as tags :${MAJOR}, :${MAJOR}.${MINOR} e :latest são atualizadas a cada release bem-sucedida."
            exit 1
          fi
          # Só segue se for claramente "não encontrado". Qualquer outro erro (rede, auth, etc.) falha o job
          # — antes, falha do inspect era tratada como "tag livre" e podia sobrescrever a imagem.
          if ! echo "${INSPECT_OUT}" | grep -qiE 'no such|not found|manifest unknown|does not exist|404|NAME_UNKNOWN|MANIFEST_UNKNOWN'; then
            echo "::error::Não foi possível verificar se a tag '${FULL}' já existe (rc=${INSPECT_RC}). Abortando para não sobrescrever por engano."
            echo "${INSPECT_OUT}"
            exit 1
          fi
          echo "Tag :${FULL} não encontrada no registry — ok para publicar."

          docker build -t "${IMAGE}:${FULL}" .
          docker tag "${IMAGE}:${FULL}" "${IMAGE}:${MAJOR}.${MINOR}"
          docker tag "${IMAGE}:${FULL}" "${IMAGE}:${MAJOR}"
          docker tag "${IMAGE}:${FULL}" "${IMAGE}:latest"

          docker push "${IMAGE}:${FULL}"
          docker push "${IMAGE}:${MAJOR}.${MINOR}"
          docker push "${IMAGE}:${MAJOR}"
          docker push "${IMAGE}:latest"
